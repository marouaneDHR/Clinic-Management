<main>
  <div class="card">
    <div class="card-header">
      <h2 class="text-center text-body-emphasis">Patients</h2>
    </div>
    <div class="card-body">
      <div class="card-text">
        <table class="table table-striped table-hover text-center">
          <thead >
          <th *ngFor="let head of tableHead" scope="col" >{{head}}</th>
          </thead>
          <tbody>
          <tr *ngFor="let patient of patients" >
            <th scope="row">{{patient.id}}</th>
            <td>{{patient.firstName}} {{patient.lastName}}</td>
            <td>{{patient.gender}}</td>
            <td>{{patient.bloodGroup}}</td>
            <td>{{patient.address}}</td>
            <td>{{patient.email}}</td>
            <td>{{patient.phone}}</td>
            <td>
              <div>
                <button type="button" class="btn btn-sm btn-success ms-2" data-bs-toggle="modal" data-bs-target="#AddForm" (click)="setUpdateForm(patient)">
                  <i class="bi bi-pencil-fill" ></i>
                </button>
                <button type="button" class="btn btn-sm btn-danger ms-2" (click)="deletePatient(patient.id)" >
                  <i class="bi bi-trash-fill"></i>
                </button>
              </div>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="card-footer">
      <div class="d-flex justify-content-end">
        <button type="button" class="btn btn-success"  data-bs-toggle="modal" data-bs-target="#AddForm">Add</button>
      </div>
    </div>
  </div>


</main>

<div  class="modal" tabindex="-1" role="dialog" id="AddForm" >
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{isEdit ? "Update Patient" : "Add Patient"}}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" ></button>
      </div>
      <div class="modal-body">
        <form [formGroup]="patientForm" (ngSubmit)="isEdit ? updatePatient() : createPatient()">

          <div hidden="hidden">
            <label for="id" class="col-form-label">Id</label>
            <input type="text"  id="id" class="form-control" formControlName="id"  >
          </div>

          <label for="firstName" class="col-form-label">First Name</label>
          <input type="text"  id="firstName" class="form-control" formControlName="firstName"  >

          <label for="lastName">Last Name</label>
          <input type="text" id="lastName"  class="form-control" formControlName="lastName" >

          <label for="gender">Gender</label>
          <input type="text" id="gender" class="form-control"  formControlName="gender" >

          <label for="email">Email</label>
          <input type="text"  id="email" class="form-control" formControlName="email" >

          <label for="phone">Phone</label>
          <input type="text"  id="phone" class="form-control" formControlName="phone" >

          <label for="address">Address</label>
          <input type="text"  id="address" class="form-control" formControlName="address" >

          <label for="bloodGroup">Blood Group</label>
          <input type="text" id="bloodGroup" class="form-control" formControlName="bloodGroup" >

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="submit" class="btn btn-primary" data-bs-dismiss="modal">{{isEdit ? "Update" : "Save"}}</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
